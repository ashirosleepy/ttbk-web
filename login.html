<!DOCTYPE html>
<html lang="vi">
<head>
<link rel="icon" type="image/png" href="./css/ttbk.png">
<link rel="apple-touch-icon" href="./css/ttbk.png">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Đăng nhập — TTBK</title>
<link rel="stylesheet" href="./css/style.css" />
<meta name="theme-color" content="#A13F52" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-theme-row">
      <span>Giao diện</span>
      <button type="button" class="theme-switch" id="theme-switch" aria-label="Chuyển giao diện sáng / tối" aria-pressed="false" title="Chuyển giao diện sáng / tối">
        <span class="theme-switch-track"><span class="theme-switch-thumb"></span></span>
      </button>
    </div>
    <div class="auth-mark">TT<span>BK</span></div>
    <p class="auth-sub">Nhà chung — việc chung. Đăng nhập để xem việc hôm nay.</p>

    <div class="auth-error" id="auth-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="ten@tro.local" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">Đăng nhập</button>
    </form>

    <p class="auth-hint">
      Chưa có tài khoản? Nhờ người quản trị tạo tài khoản trong Supabase Dashboard
      (Authentication → Users → Add user).
    </p>
  </div>

  <script type="module" src="/src/login.js"></script>
</body>
</html>
