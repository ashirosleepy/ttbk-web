<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Debug Points System</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
  h1, h2 { color: #333; }
  .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; margin: 10px 0; }
  th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
  th { background: #f5f5f5; }
  .positive { color: green; }
  .negative { color: red; }
  .error { color: red; font-weight: bold; }
  .info { color: blue; }
  button { padding: 10px 20px; margin: 5px; cursor: pointer; }
  pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
</style>
</head>
<body>
<h1>🔍 Debug Point System - TTBK</h1>

<div class="section">
<h2>📊 Tổng quan hệ thống điểm</h2>
<button onclick="loadPointOverview()">Tải tổng quan điểm</button>
<div id="point-overview"></div>
</div>

<div class="section">
<h2>📋 Chi tiết điều chỉnh điểm (point_adjustments)</h2>
<button onclick="loadPointAdjustments()">Tải điều chỉnh điểm</button>
<div id="point-adjustments"></div>
</div>

<div class="section">
<h2>📜 Nhật ký hoạt động (task_history)</h2>
<button onclick="loadTaskHistory()">Tải nhật ký hoạt động</button>
<div id="task-history"></div>
</div>

<div class="section">
<h2>✅ Việc đã hoàn thành (tasks)</h2>
<button onclick="loadCompletedTasks()">Tải việc đã hoàn thành</button>
<div id="completed-tasks"></div>
</div>

<div class="section">
<h2>🔧 Chẩn đoán sự cố</h2>
<button onclick="diagnosePointSystem()">Chẩn đoán hệ thống điểm</button>
<div id="diagnosis"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://vxkcamaaqpdcyapzcoxx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4a2NhbWFhcXBkY3lhcHpjb3h4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MzE2MTEsImV4cCI6MjEwNDIwNzYxMX0.TGWaO9bQmp4NtAg7ZghjjDZCobXeSWrVH9X9qGXXLVA";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let profiles = [];
let pointAdjustments = [];
let taskHistory = [];
let completedTasks = [];

async function loadProfiles() {
  const { data, error } = await supabase.from('profiles').select('*');
  if (error) {
    console.error('Error loading profiles:', error);
    return [];
  }
  profiles = data || [];
  return profiles;
}

async function loadPointOverview() {
  const overviewDiv = document.getElementById('point-overview');
  overviewDiv.innerHTML = '<p>Đang tải...</p>';
  
  try {
    await loadProfiles();
    
    // Load completed tasks
    const { data: tasks, error: taskError } = await supabase
      .from('tasks')
      .select('assigned_to, completed_by, points')
      .eq('status', 'hoan_thanh');
    
    if (taskError) throw taskError;
    completedTasks = tasks || [];
    
    // Load point adjustments
    const { data: adjustments, error: adjError } = await supabase
      .from('point_adjustments')
      .select('*');
    
    if (adjError) throw adjError;
    pointAdjustments = adjustments || [];
    
    // Calculate points per user
    const userPoints = {};
    profiles.forEach(p => userPoints[p.id] = { name: p.name, taskPoints: 0, adjustments: 0, total: 0 });
    
    // Calculate task points
    completedTasks.forEach(task => {
      const creditedUserId = task.completed_by || task.assigned_to;
      if (userPoints[creditedUserId]) {
        userPoints[creditedUserId].taskPoints += task.points || 0;
      }
    });
    
    // Calculate adjustments
    pointAdjustments.forEach(adj => {
      if (userPoints[adj.user_id]) {
        userPoints[adj.user_id].adjustments += adj.delta || 0;
      }
    });
    
    // Calculate total
    Object.keys(userPoints).forEach(userId => {
      userPoints[userId].total = userPoints[userId].taskPoints + userPoints[userId].adjustments;
    });
    
    // Display results
    let html = '<table><tr><th>Thành viên</th><th>Điểm việc</th><th>Điều chỉnh</th><th>Tổng</th></tr>';
    Object.values(userPoints).forEach(user => {
      const adjClass = user.adjustments >= 0 ? 'positive' : 'negative';
      html += `<tr>
        <td>${user.name}</td>
        <td>${user.taskPoints}</td>
        <td class="${adjClass}">${user.adjustments >= 0 ? '+' : ''}${user.adjustments}</td>
        <td><strong>${user.total}</strong></td>
      </tr>`;
    });
    html += '</table>';
    
    overviewDiv.innerHTML = html;
  } catch (error) {
    overviewDiv.innerHTML = `<p class="error">Lỗi: ${error.message}</p>`;
  }
}

async function loadPointAdjustments() {
  const div = document.getElementById('point-adjustments');
  div.innerHTML = '<p>Đang tải...</p>';
  
  try {
    await loadProfiles();
    
    const { data, error } = await supabase
      .from('point_adjustments')
      .select('*')
      .order('created_at', { ascending: false });
    
    if (error) throw error;
    pointAdjustments = data || [];
    
    const profileMap = {};
    profiles.forEach(p => profileMap[p.id] = p.name);
    
    let html = `<p>Tổng số: ${pointAdjustments.length} bản ghi</p>`;
    html += '<table><tr><th>Thời gian</th><th>Thành viên</th><th>Thay đổi</th><th>Lý do</th><th>Task ID</th></tr>';
    
    pointAdjustments.forEach(adj => {
      const deltaClass = adj.delta >= 0 ? 'positive' : 'negative';
      const userName = profileMap[adj.user_id] || 'Unknown';
      html += `<tr>
        <td>${new Date(adj.created_at).toLocaleString('vi-VN')}</td>
        <td>${userName}</td>
        <td class="${deltaClass}">${adj.delta >= 0 ? '+' : ''}${adj.delta}</td>
        <td>${adj.reason || '-'}</td>
        <td>${adj.task_id ? adj.task_id.substring(0, 8) + '...' : '-'}</td>
      </tr>`;
    });
    
    html += '</table>';
    div.innerHTML = html;
  } catch (error) {
    div.innerHTML = `<p class="error">Lỗi: ${error.message}</p>`;
  }
}

async function loadTaskHistory() {
  const div = document.getElementById('task-history');
  div.innerHTML = '<p>Đang tải...</p>';
  
  try {
    await loadProfiles();
    
    const { data, error } = await supabase
      .from('task_history')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(100);
    
    if (error) throw error;
    taskHistory = data || [];
    
    const profileMap = {};
    profiles.forEach(p => profileMap[p.id] = p.name);
    
    let html = `<p>Tổng số: ${taskHistory.length} bản ghi (hiển thị 100 gần nhất)</p>`;
    html += '<table><tr><th>Thời gian</th><th>Người dùng</th><th>Hành động</th><th>Chi tiết</th></tr>';
    
    taskHistory.forEach(hist => {
      const userName = profileMap[hist.user_id] || 'Unknown';
      html += `<tr>
        <td>${new Date(hist.created_at).toLocaleString('vi-VN')}</td>
        <td>${userName}</td>
        <td>${hist.action}</td>
        <td>${hist.detail || '-'}</td>
      </tr>`;
    });
    
    html += '</table>';
    div.innerHTML = html;
  } catch (error) {
    div.innerHTML = `<p class="error">Lỗi: ${error.message}</p>`;
  }
}

async function loadCompletedTasks() {
  const div = document.getElementById('completed-tasks');
  div.innerHTML = '<p>Đang tải...</p>';
  
  try {
    await loadProfiles();
    
    const { data, error } = await supabase
      .from('tasks')
      .select('*')
      .eq('status', 'hoan_thanh')
      .order('completed_at', { ascending: false });
    
    if (error) throw error;
    
    const profileMap = {};
    profiles.forEach(p => profileMap[p.id] = p.name);
    
    let html = `<p>Tổng số: ${data.length} việc đã hoàn thành</p>`;
    html += '<table><tr><th>Việc</th><th>Người giao</th><th>Người làm</th><th>Điểm</th><th>Hoàn thành</th></tr>';
    
    data.forEach(task => {
      const assignedName = profileMap[task.assigned_to] || 'Unknown';
      const completedName = task.completed_by ? profileMap[task.completed_by] : 'Unknown';
      html += `<tr>
        <td>${task.title}</td>
        <td>${assignedName}</td>
        <td>${completedName}</td>
        <td>${task.points || 0}</td>
        <td>${task.completed_at ? new Date(task.completed_at).toLocaleString('vi-VN') : '-'}</td>
      </tr>`;
    });
    
    html += '</table>';
    div.innerHTML = html;
  } catch (error) {
    div.innerHTML = `<p class="error">Lỗi: ${error.message}</p>`;
  }
}

async function diagnosePointSystem() {
  const div = document.getElementById('diagnosis');
  div.innerHTML = '<p>Đang chẩn đoán...</p>';
  
  try {
    await loadProfiles();
    await loadPointOverview();
    
    const issues = [];
    const warnings = [];
    
    // Check for duplicate point adjustments for same task
    const taskAdjustmentMap = {};
    pointAdjustments.forEach(adj => {
      if (adj.task_id) {
        const key = `${adj.task_id}_${adj.user_id}_${adj.reason}`;
        if (taskAdjustmentMap[key]) {
          issues.push(`Trùng lặp điều chỉnh điểm: Task ${adj.task_id.substring(0,8)}... User ${adj.user_id} Reason ${adj.reason}`);
        }
        taskAdjustmentMap[key] = true;
      }
    });
    
    // Check for tasks completed but no points credited
    completedTasks.forEach(task => {
      const creditedUserId = task.completed_by || task.assigned_to;
      const hasTaskPoints = task.points > 0;
      
      if (hasTaskPoints) {
        // Check if there are any negative adjustments that might cancel out the points
        const relatedAdjustments = pointAdjustments.filter(adj => 
          adj.task_id === task.id && adj.user_id === creditedUserId
        );
        
        if (relatedAdjustments.length > 0) {
          const totalAdj = relatedAdjustments.reduce((sum, adj) => sum + adj.delta, 0);
          if (totalAdj === -task.points) {
            warnings.push(`Task "${task.title}" (${task.id.substring(0,8)}...): Điểm việc bị hủy hoàn toàn bởi điều chỉnh`);
          }
        }
      }
    });
    
    // Check for "qua_han" and "bi_lam_ho" inconsistencies
    const overdueAdjustments = pointAdjustments.filter(adj => adj.reason === 'qua_han');
    const helpedAdjustments = pointAdjustments.filter(adj => adj.reason === 'bi_lam_ho');
    
    overdueAdjustments.forEach(adj => {
      const correspondingHelped = helpedAdjustments.find(h => h.task_id === adj.task_id);
      if (correspondingHelped) {
        warnings.push(`Task ${adj.task_id.substring(0,8)}...: Cả "qua_han" và "bi_lam_ho" đều tồn tại - có thể trùng lặp`);
      }
    });
    
    // Check for negative adjustments without corresponding task completion
    const negativeAdjustments = pointAdjustments.filter(adj => adj.delta < 0);
    negativeAdjustments.forEach(adj => {
      if (adj.task_id) {
        const task = completedTasks.find(t => t.id === adj.task_id);
        if (!task) {
          warnings.push(`Điều chỉnh điểm âm cho task ${adj.task_id.substring(0,8)}... nhưng task không tìm thấy trong danh sách hoàn thành`);
        }
      }
    });
    
    // Display results
    let html = '<h3>Kết quả chẩn đoán</h3>';
    
    if (issues.length > 0) {
      html += '<h4 class="error">⚠️ Vấn đề nghiêm trọng:</h4><ul>';
      issues.forEach(issue => {
        html += `<li class="error">${issue}</li>`;
      });
      html += '</ul>';
    }
    
    if (warnings.length > 0) {
      html += '<h4 class="info">ℹ️ Cảnh báo:</h4><ul>';
      warnings.forEach(warning => {
        html += `<li class="info">${warning}</li>`;
      });
      html += '</ul>';
    }
    
    if (issues.length === 0 && warnings.length === 0) {
      html += '<p class="positive">✅ Không phát hiện vấn đề rõ ràng trong dữ liệu điểm.</p>';
    }
    
    html += '<h4>Thống kê:</h4>';
    html += `<ul>
      <li>Số thành viên: ${profiles.length}</li>
      <li>Việc đã hoàn thành: ${completedTasks.length}</li>
      <li>Bản ghi điều chỉnh điểm: ${pointAdjustments.length}</li>
      <li>Điều chỉnh âm: ${pointAdjustments.filter(a => a.delta < 0).length}</li>
      <li>Điều chỉnh dương: ${pointAdjustments.filter(a => a.delta > 0).length}</li>
    </ul>`;
    
    div.innerHTML = html;
  } catch (error) {
    div.innerHTML = `<p class="error">Lỗi chẩn đoán: ${error.message}</p>`;
  }
}
</script>
</body>
</html>
