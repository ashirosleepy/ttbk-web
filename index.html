<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ Tay Nhóm — Công việc & Chi tiêu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="spiral-edge" id="spiralEdge"></div>

<!-- ===================== AUTH SCREEN ===================== -->
<div class="auth-wrap" id="authWrap">
  <div class="auth-card">
    <h1 class="brand">📒 Sổ Tay Nhóm
      <small>Công việc &amp; chi tiêu cho nhóm 4 người</small>
    </h1>

    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" required placeholder="ban@email.com">
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" minlength="6">
      </div>
      <button type="submit" class="btn btn-block" id="loginBtn">Đăng nhập</button>
    </form>

    <form id="signupForm" style="display:none;">
      <div class="field">
        <label>Họ tên</label>
        <input type="text" id="signupName" required placeholder="Nguyễn Văn A">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="signupEmail" required placeholder="ban@email.com">
      </div>
      <div class="field">
        <label>Mật khẩu (tối thiểu 6 ký tự)</label>
        <input type="password" id="signupPassword" required minlength="6" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-block" id="signupBtn">Tạo tài khoản</button>
    </form>

    <div class="auth-error" id="authError"></div>

    <div class="auth-toggle" id="toggleToSignup">
      Chưa có tài khoản? <a onclick="showSignup()">Đăng ký ngay</a>
    </div>
    <div class="auth-toggle" id="toggleToLogin" style="display:none;">
      Đã có tài khoản? <a onclick="showLogin()">Đăng nhập</a>
    </div>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div class="app-wrap" id="appWrap" style="display:none;">

  <div class="topbar">
    <h1 class="brand">📒 Sổ Tay Nhóm</h1>
    <div class="me">
      <div class="me-name" id="meName"></div>
      <div class="avatar" id="meAvatar">🧑‍🎓</div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Đăng xuất</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="tasks">📋 Công việc</button>
    <button class="tab-btn" data-tab="expenses">💰 Chi tiêu</button>
  </div>

  <!-- ---------- TAB: TASKS ---------- -->
  <div class="tab-panel active" id="tab-tasks">
    <div class="panel-head">
      <h2>Bảng công việc nhóm</h2>
      <button class="btn btn-yellow btn-sm" id="addTaskBtn">+ Thêm việc</button>
    </div>
    <div class="kanban">
      <div class="kcol">
        <h3><span class="dot dot-todo"></span>Chưa làm</h3>
        <div id="col-todo"></div>
      </div>
      <div class="kcol">
        <h3><span class="dot dot-doing"></span>Đang làm</h3>
        <div id="col-doing"></div>
      </div>
      <div class="kcol">
        <h3><span class="dot dot-done"></span>Đã xong</h3>
        <div id="col-done"></div>
      </div>
    </div>
  </div>

  <!-- ---------- TAB: EXPENSES ---------- -->
  <div class="tab-panel" id="tab-expenses">
    <div class="summary-grid" id="summaryGrid"></div>

    <div class="panel-head">
      <h2>Cần thanh toán</h2>
    </div>
    <div class="settle-list" id="settleList"></div>

    <div class="panel-head">
      <h2>Lịch sử chi tiêu</h2>
      <button class="btn btn-yellow btn-sm" id="addExpenseBtn">+ Thêm khoản chi</button>
    </div>
    <div class="expense-list" id="expenseList"></div>
  </div>

</div>

<!-- ===================== MODAL: ADD/EDIT TASK ===================== -->
<div class="modal-bg" id="taskModalBg">
  <div class="modal">
    <h3 id="taskModalTitle">Thêm việc mới</h3>
    <form id="taskForm">
      <input type="hidden" id="taskId">
      <div class="field">
        <label>Tên công việc</label>
        <input type="text" id="taskTitle" required placeholder="VD: Làm slide thuyết trình">
      </div>
      <div class="field">
        <label>Mô tả (không bắt buộc)</label>
        <input type="text" id="taskDesc" placeholder="Chi tiết công việc...">
      </div>
      <div class="field">
        <label>Giao cho</label>
        <select id="taskAssignee"></select>
      </div>
      <div class="field">
        <label>Hạn chót (không bắt buộc)</label>
        <input type="date" id="taskDue">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeTaskModal()">Huỷ</button>
        <button type="submit" class="btn btn-yellow">Lưu</button>
      </div>
    </form>
  </div>
</div>

<!-- ===================== MODAL: ADD EXPENSE ===================== -->
<div class="modal-bg" id="expenseModalBg">
  <div class="modal">
    <h3>Thêm khoản chi</h3>
    <form id="expenseForm">
      <div class="field">
        <label>Nội dung</label>
        <input type="text" id="expDesc" required placeholder="VD: Tiền in tài liệu nhóm">
      </div>
      <div class="field">
        <label>Số tiền (VNĐ)</label>
        <input type="number" id="expAmount" required min="1" step="1000" placeholder="150000">
      </div>
      <div class="field">
        <label>Người trả tiền</label>
        <select id="expPaidBy"></select>
      </div>
      <div class="field">
        <label>Ngày chi</label>
        <input type="date" id="expDate">
      </div>
      <div class="field">
        <label>Chia đều cho những ai?</label>
        <div class="checks-list" id="expShareChecks"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeExpenseModal()">Huỷ</button>
        <button type="submit" class="btn btn-yellow">Lưu</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
